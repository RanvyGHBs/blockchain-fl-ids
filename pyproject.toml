[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring the local untracked NSL-KDD dataset in data/raw/ (exclude in CI with -m 'not integration')",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Controlled baseline correctness checks across the full codebase (0 pre-existing violations).
# Stricter unused-import/variable hygiene (E4,E7,E9,F) is enforced on Phase 1/2 maintained modules.
select = [
    "E9",
    "E711",
    "E712",
    "E721",
    "E722",
    "F631",
    "F632",
    "F633",
    "F701",
    "F702",
    "F704",
    "F706",
    "F707",
    "F811",
    "F821",
    "F822",
    "F823",
    "B006",
    "B011",
    "B012",
]
